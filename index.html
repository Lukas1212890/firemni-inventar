<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Firemní inventář</title></head><body><div style="font-family:system-ui;padding:24px">Načítám inventář…</div><script>window.__gzChunks=[];</script>
<script src="gz01.js"></script>
<script src="gz02.js"></script>
<script src="gz03.js"></script>
<script src="gz04.js"></script>
<script>(async()=>{try{const b64=window.__gzChunks.join('');const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const stream=new Blob([bytes]).stream().pipeThrough(ds);const ab=await new Response(stream).arrayBuffer();const text=new TextDecoder('utf-8').decode(ab);document.open();document.write(text);document.close();}catch(e){document.body.innerHTML='<p style="font-family:system-ui;padding:24px">Aplikaci se nepodařilo načíst. Aktualizujte prosím prohlížeč.</p>';console.error(e);}})();</script></body></html>
